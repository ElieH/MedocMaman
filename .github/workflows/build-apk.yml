name: Build MedocMaman APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-read-only: false

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Rename APK for easy sideloading
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/MedocMaman-debug.apk

      - name: Publish Direct-Download APK to GitHub Releases
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest app/build/outputs/apk/debug/MedocMaman-debug.apk \
            --title "MedocMaman APK (Dernière version)" \
            --notes "Téléchargez **MedocMaman-debug.apk** directement sur le Xiaomi Redmi de Maman ou sur les téléphones des enfants."

      - name: Upload MedocMaman APK Artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: MedocMaman-APK
          path: app/build/outputs/apk/debug/MedocMaman-debug.apk
          if-no-files-found: warn
