name: Build MedocMaman APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Rename APK for easy sideloading
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/MedocMaman-debug.apk

      - name: Upload MedocMaman APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MedocMaman-APK
          path: app/build/outputs/apk/debug/MedocMaman-debug.apk
          if-no-files-found: error
